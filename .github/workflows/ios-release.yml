name: iOS Release

# Manually-triggered iOS build, mirroring android-release.yml. Runs the full CI
# suite as a gate, then builds the iOS app on a macOS runner.
#
# Two modes via the `distribute` input:
#   • false — no secrets needed: an unsigned `flutter build ios --no-codesign`
#     that compiles the whole app (Swift AppDelegate, plugins, SPM/CocoaPods) on
#     real Apple toolchain and uploads the .app as an artifact. This is the
#     macOS equivalent of the Android compile gate, and how the iOS build was
#     verified before any signing existed. `dependencies.yml` still runs this
#     shape every week, so the compile gate is covered without this workflow
#     defaulting to it.
#   • true (default) — a signed build. `export_method` then picks what kind:
#       – app-store (default) — uploaded to TestFlight.
#       – development — a sideloadable IPA, signed with a development profile
#         and carrying RunnerDebug.entitlements, which is the ONLY way to get
#         Apple's Tap to Pay *development* entitlement onto a phone without a
#         Mac. Needs at least one device registered to the team (Apple issues no
#         development profile otherwise). Install it with `ideviceinstaller -i`.
#         Nothing is uploaded to App Store Connect; the artifact is the output.
#     Fail-fast on missing signing secrets (same pattern as the Android keystore
#     step).
#
# The `flavor` input picks the backend (staging vs prod). iOS has no on-device
# `flutter run` without a Mac, so this workflow is the ONLY way to get a build
# onto a phone — it therefore serves both roles: `prod` for a release (the
# default, because the common case now is shipping to TestFlight) and `staging`
# for test builds. Same App Store Connect signing either way (Apple signing is
# account-level, not per-environment); only the bundled backend URL changes.
#
# Switch `flavor` to staging whenever you are exercising push or Tap to Pay by
# hand: the default sends real invoices and production APNs tokens, which is
# right for TestFlight and wrong for poking at the app.
on:
  workflow_dispatch:
    inputs:
      distribute:
        description: "Signed build + upload to TestFlight (needs signing secrets). Uncheck for an unsigned compile-only check."
        type: boolean
        default: true
      flavor:
        description: "Backend the build points at"
        type: choice
        default: prod
        options: [staging, prod]
      export_method:
        description: "app-store = TestFlight. development = sideloadable build carrying the Tap to Pay DEV entitlement (needs distribute:true and a registered device)"
        type: choice
        default: app-store
        options: [app-store, development]

concurrency:
  group: ios-release-${{ github.ref }}
  # Don't cancel an in-progress release — it may be mid-upload to App Store Connect.
  cancel-in-progress: false

defaults:
  run:
    working-directory: fishauctions_application

env:
  FLUTTER_VERSION: 3.44.1

jobs:
  # Gate: reuse the exact CI checks (codegen freshness, format, analyze, test) so
  # a build can never ship code that wouldn't pass CI — identical to the Android
  # release's gate. Runs on Linux; only the build job below needs macOS.
  verify:
    name: CI checks
    uses: ./.github/workflows/ci.yml

  build:
    name: Build iOS app
    needs: verify
    # macOS is required for any iOS build. `macos-latest` tracks the current
    # Apple-silicon image; pin (e.g. macos-15) + maxim-lobanov/setup-xcode if a
    # future image bumps Xcode and breaks the build.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # A development export is still a *signed* build — it just gets a
      # development profile instead of an App Store one, so it needs the same
      # API key. Checked before anything is built: the unsigned path below takes
      # the better part of an hour, and failing after it would be the most
      # expensive possible way to report a wrong pair of inputs. (It sits after
      # checkout rather than first because `defaults.run.working-directory` is
      # the repo subdirectory, which doesn't exist until then.)
      - name: Reject development export without signing
        if: ${{ inputs.export_method == 'development' && !inputs.distribute }}
        run: |
          echo "::error::export_method=development requires distribute:true — a development export is a signed build."
          exit 1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Marketing version = the build date (CalVer, e.g. 2026.7.13), computed by
      # the identical step in android-release.yml so both stores share one scheme
      # with nothing to bump, store, or forget. `10#` forces base-10 so a leading
      # zero isn't read as octal (and Apple dislikes "07").
      - name: Compute version name (CalVer)
        run: |
          Y=$(date -u +%Y); M=$(date -u +%m); D=$(date -u +%d)
          echo "BUILD_NAME=$Y.$((10#$M)).$((10#$D))" >> "$GITHUB_ENV"

      # ── Unsigned build (distribute == false) ───────────────────────────────
      # No --flavor: iOS has no Xcode schemes; environment selection is
      # dart-define only (Android's --flavor merely sets the applicationId).
      # --no-codesign skips signing, so this needs no certificates — it just
      # proves the app compiles and links on Apple toolchain (the point of the
      # gate today).
      #
      # Versioning: --build-number (CFBundleVersion) is this workflow's run
      # number — independent of Android's, which is correct: the App Store and
      # Play track versions separately, so they needn't match and can't collide.
      # --build-name (CFBundleShortVersionString) is the shared CalVer date, so
      # the public version moves on its own with nothing to remember.
      - name: Build unsigned iOS app
        if: ${{ !inputs.distribute }}
        run: >
          flutter build ios --release --no-codesign
          --dart-define=FLAVOR=${{ inputs.flavor }}
          --build-number=${{ github.run_number }}
          --build-name=$BUILD_NAME

      # Flutter can fail an iOS build and print none of the reason: it passes
      # xcodebuild `-quiet` unless verbose, and on failure prints a diagnosis
      # instead of the output — with no parsed .xcresult issues it takes
      # ios/mac.dart's `noDevelopmentTeamInstruction` branch ("Building a
      # deployable iOS app requires a selected Development Team"), which sets
      # issueDetected and so skips `_parseIssueInStdout`, the only thing that
      # would have dumped stdout/stderr. On a --no-codesign build that message
      # is pure noise and the real compiler error is nowhere in the log. `-v`
      # drops `-quiet`; the rebuild is incremental, so it fails again at the
      # same target quickly. Same step as in dependencies.yml.
      - name: Show the real Xcode error
        if: ${{ failure() && !inputs.distribute }}
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=FLAVOR=${{ inputs.flavor }} \
            --build-number=${{ github.run_number }} \
            --build-name=$BUILD_NAME -v \
            > "$RUNNER_TEMP/ios-build.log" 2>&1 || true
          {
            echo "### Xcode errors"
            echo '```'
            grep -E "error:|The following build commands failed|nonzero exit code" \
              "$RUNNER_TEMP/ios-build.log" | head -60 || echo "(no error: lines matched)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "──────── last 400 lines of the verbose build ────────"
          tail -n 400 "$RUNNER_TEMP/ios-build.log"

      - name: Upload unsigned .app artifact
        if: ${{ !inputs.distribute }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-app-unsigned-${{ github.sha }}
          # Not installable (unsigned) — this is a build-verification artifact.
          path: fishauctions_application/build/ios/iphoneos/Runner.app
          if-no-files-found: error
          # One day, matching android-release.yml: this is a public repo, so
          # every run's artifacts are downloadable by anyone. See the note there.
          retention-days: 1

      # ── Signed build + TestFlight (distribute == true, the default) ────────
      # Mac-less signing via an App Store Connect API key + Xcode automatic
      # cloud signing (`-allowProvisioningUpdates`): Xcode creates and manages
      # the distribution certificate and provisioning profile in the cloud, so
      # there is NO hand-made cert/.p12 or .mobileprovision to maintain. The
      # only secrets are the API key (three values) and the team id:
      #   APPSTORE_API_KEY_ID       — the key's ID (e.g. 2X9…)
      #   APPSTORE_API_ISSUER_ID    — the issuer UUID (same page)
      #   APPSTORE_API_PRIVATE_KEY  — the .p8 contents (paste the whole file)
      #   APPLE_TEAM_ID             — your 10-char Developer Team ID
      # Step-by-step to create these: PUSH.md / IOS.md. First `distribute:true`
      # run is the shakeout — cloud signing needs the bundle id registered and
      # a TestFlight app record to exist for com.fishauctions.app.
      - name: Check signing secrets
        if: ${{ inputs.distribute }}
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=
          for v in APPSTORE_API_KEY_ID APPSTORE_API_ISSUER_ID APPSTORE_API_PRIVATE_KEY APPLE_TEAM_ID; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Signed iOS build requested but missing secrets:$missing (see IOS.md)."
            exit 1
          fi

      # xcodebuild reads the key from ~/.appstoreconnect/private_keys or
      # ~/private_keys as AuthKey_<KEYID>.p8; the archive/export use it for
      # -allowProvisioningUpdates, and the TestFlight upload reuses it.
      - name: Stage App Store Connect API key
        if: ${{ inputs.distribute }}
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$APPSTORE_API_PRIVATE_KEY" > ~/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8

      # Tap to Pay's entitlement lives ONLY in RunnerDebug.entitlements, because
      # Apple's *development* grant attaches to development provisioning
      # profiles and putting it in Runner.entitlements breaks every App Store
      # export until the publishing grant lands (see TAPTOPAY.md). A development
      # export is exactly the case that can carry it — so swap the file rather
      # than passing CODE_SIGN_ENTITLEMENTS on the xcodebuild command line,
      # which xcodebuild cannot scope to one target and would leak to every SPM
      # and Pod target in the workspace (the same trap documented for
      # CODE_SIGN_IDENTITY below). The project setting already points the Runner
      # target at this path, so the swap is precisely scoped.
      #
      # It also switches aps-environment to `development`, which is correct
      # here: a development-signed build registers sandbox APNs tokens. That is
      # another reason this build is for testing only and must never be the one
      # that reaches users.
      - name: Use the Tap to Pay development entitlements
        if: ${{ inputs.export_method == 'development' }}
        run: |
          cp ios/Runner/RunnerDebug.entitlements ios/Runner/Runner.entitlements
          echo "Runner.entitlements now carries:"
          grep -o 'com\.apple\.developer\.[a-z.-]*' ios/Runner/Runner.entitlements

      # Generated (not committed) so the team id stays a secret. Automatic
      # signing means Xcode resolves the profile itself; the API key auth block
      # lets the export talk to App Store Connect non-interactively.
      #
      # `development` is the legacy spelling of what Xcode 15.3+ calls
      # `debugging`; both are still accepted, and the old name is what every
      # existing recipe uses. Unlike an app-store export it needs a development
      # provisioning profile, which Apple will only issue to a team with at
      # least one registered device — that registration is the whole
      # prerequisite for this path.
      - name: Write ExportOptions.plist
        if: ${{ inputs.distribute }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPORT_METHOD: ${{ inputs.export_method }}
        run: |
          cat > ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>${EXPORT_METHOD}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST

      # NOT `flutter build ipa`. That command passes -allowProvisioningUpdates
      # (ios/mac.dart, commands/build_ios.dart) but never the
      # -authenticationKey* flags — and `man xcodebuild` is explicit that
      # -allowProvisioningUpdates "requires a developer account to have been
      # added in Xcode's Accounts preference pane OR an App Store Connect
      # authentication key to be specified via the -authenticationKeyPath,
      # -authenticationKeyID, and -authenticationKeyIssuerID parameters". A
      # fresh runner has no Xcode account, and a .p8 sitting in ~/private_keys
      # with nothing naming it is invisible, so cloud signing fails with "No
      # Accounts: Add a new account in Accounts settings" / "No profiles for
      # 'com.fishauctions.app' were found". flutter_tools exposes no way to add
      # xcodebuild flags, hence the split below.
      #
      # --config-only does the whole Flutter-side setup and stops before
      # xcodebuild: it writes Generated.xcconfig (dart-defines, build
      # name/number), updates the SPM package's minimum deployment, and runs
      # pod install for the CocoaPods-only plugins (square_mobile_payments_sdk
      # ships no Package.swift). --no-codesign here only skips Flutter's own
      # signing-identity probe — the archive below is what signs.
      - name: Configure Xcode project (dart-defines, version, pods)
        if: ${{ inputs.distribute }}
        run: >
          flutter build ios --config-only --release --no-codesign
          --dart-define=FLAVOR=${{ inputs.flavor }}
          --build-number=${{ github.run_number }}
          --build-name=$BUILD_NAME

      # The archive is AD-HOC signed on purpose; the real signature is applied by
      # the export step below. That split exists because `xcodebuild archive`
      # under automatic signing insists on a *development* profile, which this
      # team cannot have.
      #
      # Archive-then-resign is how Xcode has always worked: the archive is signed
      # for development, and choosing a distribution method at export re-signs it.
      # Ad-hoc (`CODE_SIGN_IDENTITY=-`) satisfies the first half without a
      # provisioning profile — and therefore without a registered device — while
      # still producing a properly signed bundle for the export to re-sign. It
      # also doesn't trip the "conflicting provisioning settings" error that a
      # real identity does under CODE_SIGN_STYLE=Automatic, because ad-hoc has no
      # profile to conflict over. This is what Xcode Cloud does; credit to
      # https://developer.apple.com/forums/thread/756119 for working it out.
      #
      # NOT `CODE_SIGNING_ALLOWED=NO`. A fully unsigned archive is the recipe for
      # exporting an *unsigned* IPA, and it pairs with `signingStyle: manual` +
      # empty signing keys in ExportOptions; `signingStyle: automatic` expects a
      # normally-signed bundle to re-sign.
      #
      # Observed across three runs, so it's worth writing down: under
      # CODE_SIGN_STYLE=Automatic, Xcode resolves the archive's profile from
      # CODE_SIGN_IDENTITY, and every value it will accept there is a
      # development one. The Flutter template pins
      # `"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "iPhone Developer"` in all three
      # project-level configs (still true in 3.44), so the archive asked for an
      # "iOS App Development" profile — which Apple only issues to a team with
      # at least one registered device — and died with "Your team has no devices
      # from which to generate a provisioning profile", on a runner that will
      # never have one. Deleting the pin (done, in project.pbxproj) did not help:
      # Xcode's default iOS identity is "Apple Development", which is the same
      # kind of identity and wants the same kind of profile. And the value that
      # *would* work can't be set — automatic signing treats a specified
      # identity as a contradiction and refuses to build, whether it's passed as
      # an xcodebuild argument (where it also leaks to every SPM package target:
      # "GoogleUtilities_…-UserDefaults has conflicting provisioning settings")
      # or scoped to Runner alone via an xcconfig ("Runner is automatically
      # signed for development, but a conflicting code signing identity Apple
      # Distribution has been manually specified"). Manual signing would end the
      # argument, but it means minting and storing a distribution cert + profile
      # ourselves — the exact maintenance this pipeline was built to avoid.
      #
      # No -allowProvisioningUpdates / -authenticationKey* here: ad-hoc signing
      # never talks to App Store Connect, so this step needs no credentials and
      # the export below is the only thing that reaches Apple.
      - name: Archive (ad-hoc signed — export re-signs for distribution)
        if: ${{ inputs.distribute }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            archive

      # App Store Connect reports ITMS-90035/90205/90206 by *email*, minutes after
      # a successful upload, so a broken build looks like a green run — that's how
      # build 7 shipped. Square's setup phase (ios/Podfile, post_integrate) is
      # what removes these, and its own guard means a phase that never ran fails
      # silently. Check the archive instead of finding out later: both conditions
      # below are rejections on upload, so failing here costs nothing and saves a
      # round trip.
      - name: Verify Square framework was cleaned up
        if: ${{ inputs.distribute }}
        run: |
          fw="$RUNNER_TEMP/Runner.xcarchive/Products/Applications/Runner.app/Frameworks/SquareMobilePaymentsSDK.framework"
          if [ ! -d "$fw" ]; then
            echo "::error::SquareMobilePaymentsSDK.framework is not in the archive at all."
            exit 1
          fi
          bad=0
          if [ -d "$fw/Frameworks" ]; then
            echo "::error::Nested Frameworks still present (ITMS-90205/90206) — Square's setup phase did not run. Check it is the LAST build phase on Runner; see IOS.md."
            bad=1
          fi
          if [ -e "$fw/setup" ]; then
            echo "::error::The setup executable is still present (ITMS-90035) — Square's setup phase did not run."
            bad=1
          fi
          [ "$bad" = 0 ] && echo "Square framework is clean."
          exit $bad

      # This is where signing actually happens, for the whole app bundle at once.
      # ExportOptions asks for method=app-store + signingStyle=automatic, so the
      # API key below lets Xcode create/fetch the distribution certificate and
      # the App Store provisioning profile in the cloud — neither of which
      # requires a registered device.
      - name: Export signed IPA
        if: ${{ inputs.distribute }}
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID"

      # xcodebuild names the .ipa itself (from the archive's product), and
      # nothing here can predict which of PRODUCT_NAME / CFBundleName /
      # CFBundleDisplayName it picks — flutter_tools prints "$path/*.ipa" for
      # the same reason. So glob it rather than hardcode a filename that breaks
      # the day one of those three changes.
      - name: Locate the exported IPA
        if: ${{ inputs.distribute }}
        run: |
          ipa=$(find "$RUNNER_TEMP/ipa" -maxdepth 1 -name '*.ipa' | head -1)
          if [ -z "$ipa" ]; then
            echo "::error::xcodebuild -exportArchive produced no .ipa."
            ls -la "$RUNNER_TEMP/ipa" || true
            exit 1
          fi
          echo "Exported $ipa"
          echo "IPA_PATH=$ipa" >> "$GITHUB_ENV"

      # `wait-for-processing` defaults to true: after uploading, the action polls
      # App Store Connect until the build finishes processing. Worth keeping —
      # it's the only in-CI signal that the upload was actually *accepted* — but
      # know its failure mode: App Store Connect JWTs are capped at 20 minutes and
      # the action mints one and never refreshes it, so a poll that runs longer
      # dies with
      #
      #   Failed to query builds for processing state. (401) NOT_AUTHORIZED
      #
      # That is NOT a credentials problem. It means the upload succeeded and
      # processing didn't finish inside 20 minutes — which is what a *rejected*
      # build looks like, since the state it's waiting for never arrives. Check
      # the ITMS email and App Store Connect before touching any secret.
      - name: Upload to TestFlight
        if: ${{ inputs.distribute && inputs.export_method != 'development' }}
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      # For an app-store export this is kept for post-mortems: that IPA can't be
      # sideloaded, but having the exact uploaded artifact beats re-running the
      # build to inspect what shipped. For a **development** export this
      # artifact IS the deliverable — nothing uploads it anywhere, so download
      # it and install it over USB:
      #
      #   sudo apt install ideviceinstaller     # same toolchain as idevice_id
      #   ideviceinstaller -i auction.fish.ipa
      #
      # It will only install on a device registered to the team, which is the
      # point. Retention is one day, so download it the same day.
      - name: Upload IPA artifact
        if: ${{ inputs.distribute }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa-${{ inputs.export_method }}-${{ github.sha }}
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          # One day — see android-release.yml. TestFlight is the durable copy of
          # a distributed build; this artifact only needs to outlive the run.
          retention-days: 1
