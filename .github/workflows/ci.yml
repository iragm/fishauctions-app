name: CI

# Lint + test on every PR, and on pushes to the default branch as a safety net.
# Also callable from other workflows (workflow_call) so the release workflow can
# reuse these exact checks as a gate instead of a copy that could drift.
#
# The checks themselves live in .github/actions/flutter-verify so the weekly
# dependency-update workflow can run them too — it has to run them itself,
# because a PR pushed with GITHUB_TOKEN never triggers this workflow.
on:
  pull_request:
  push:
    branches: [master, main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.1

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/flutter-verify
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          # On since 2026-08-16. A pub bump reaches Gradle through the plugins'
          # own build files, so "nothing in a PR touches Gradle" was never true:
          # square_mobile_payments_sdk 2026.8.0 rewrote its module in Kotlin DSL
          # around an API AGP 9 had removed, and it sat on main for six days
          # because no CI job had ever run Gradle. Costs a few minutes a push.
          android-build: "true"
